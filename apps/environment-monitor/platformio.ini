; PlatformIO Project for M5PaperColor Environment Monitor
; Device: PaperColor (C151) - ESP32-S3R8, 4" 400x600 Color E-Ink, SHT40, RX8130CE

[env:m5stack-papercolor]
platform = espressif32@6.10.0
board = esp32s3box
framework = arduino

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200

; 注入编译时刻的 Unix 时间戳, 供 RTC 对时使用
extra_scripts =
    pre:build_time.py

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; PaperColor pin definitions
    -DPIN_BTN_A=10
    -DPIN_BTN_B=9
    -DPIN_BTN_C=1
    -DPIN_I2C_SDA=3
    -DPIN_I2C_SCL=2
    -DPIN_IR=48
    -DPIN_RGB_LED=21

lib_deps =
    m5stack/M5Unified @ 0.2.21
    m5stack/M5GFX @ 0.2.28
    m5stack/M5PM1 @ 1.0.7
    robtillaart/SHT4x @ 0.1.2
